<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripTrack - Histórico</title>
    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#f97316">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <!-- Reutiliza o mesmo CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <header>
            <!-- Link para voltar -->
            <a href="/" class="header-link">Voltar ao Registro</a>
            <h1>TripTrack</h1>
            <p>Histórico de Viagens</p>
        </header>

        <section id="historico-container">
            <!-- Cards de viagem serão inseridos aqui pelo historico.js -->
            <div id="lista-historico">
                <p>Carregando histórico...</p>
            </div>
        </section>

    </div>

    <!-- JS específico para esta página -->
    <script src="/static/historico.js" defer></script>

    <!-- Registro do Service Worker (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .catch((e) => console.error('Falha ao registrar o Service Worker:', e));
            });
        }
    </script>
</body>
</html>
